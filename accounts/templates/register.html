{% extends 'meals/base.html' %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded shadow">

    <h1 class="text-3xl font-bold mb-6">
        Register
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-green-600 text-white px-4 py-2 rounded"
        >
            Register
        </button>

    </form>

</div>

{% endblock %}
