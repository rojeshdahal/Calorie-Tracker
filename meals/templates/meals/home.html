{% extends 'meals/base.html' %}

{% block content %}

<div class="bg-white p-8 rounded-lg shadow-md">

    <h2 class="text-4xl font-bold text-green-600 mb-4">
        {{ title }}
    </h2>

    <p class="text-gray-700 text-lg mb-3">
        Welcome, {{ username }}
    </p>

    <p class="text-gray-700">
        Daily calorie goal: {{ calories }}
    </p>
    {% if calories > 2000 %}
    <p class="text-red-500 mt-3">
        High calorie target
    </p>
{% else %}
    <p class="text-green-500 mt-3">
        Normal calorie target
    </p>
{% endif %}

</div>

{% endblock %}
