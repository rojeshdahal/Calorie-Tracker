{% extends 'meals/base.html' %}

{% block content %}

<div class="bg-white p-8 rounded-xl shadow max-w-xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
        Edit Entry
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded"
        >
            Update
        </button>

    </form>

</div>

{% endblock %}
