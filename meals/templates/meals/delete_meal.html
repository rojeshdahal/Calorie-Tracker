{% extends 'meals/base.html' %}

{% block content %}

<div class="bg-white p-8 rounded-xl shadow max-w-lg mx-auto">

    <h1 class="text-2xl font-bold mb-4">
        Delete Entry
    </h1>

    <p class="mb-6">
        Are you sure you want to delete
        "{{ meal.food_name }}"?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="bg-red-600 text-white px-4 py-2 rounded"
        >
            Delete
        </button>

    </form>

</div>

{% endblock %}
