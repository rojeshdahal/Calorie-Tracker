{% extends 'meals/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden my-6">
    
    <div class="bg-gradient-to-r from-green-600 to-emerald-600 px-8 py-6 text-white flex justify-between items-center">
        <div>
            <span class="text-xs font-bold uppercase tracking-wider text-green-100 opacity-90">Meal Summary</span>
            <h1 class="text-3xl font-extrabold mt-1">{{ meal.food_name }}</h1>
        </div>
        <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm text-2xl">
            🍽️
        </div>
    </div>

    <div class="p-8">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 transition hover:bg-slate-100/50">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Energy</p>
                <p class="text-2xl font-black text-slate-800 mt-1">
                    {{ meal.calories }} <span class="text-sm font-normal text-slate-500">kcal</span>
                </p>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 transition hover:bg-slate-100/50">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Meal Type</p>
                <p class="text-lg font-bold text-slate-700 mt-1 capitalize">
                    ⏱️ {{ meal.meal_type }}
                </p>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 transition hover:bg-slate-100/50">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Logged On</p>
                <p class="text-sm font-bold text-slate-700 mt-2">
                    📅 {{ meal.date|date:"M d, Y" }}
                </p>
            </div>

        </div>

        <hr class="border-slate-100 mb-6" />

        <div class="flex items-center justify-between">
            <a href="{% url 'meals_list' %}" class="text-sm font-semibold text-slate-500 hover:text-slate-800 transition duration-150 flex items-center space-x-1">
                <span>←</span> <span>Back to list</span>
            </a>

            <div class="flex items-center space-x-3">
                <a
                    href="{% url 'edit_meal' meal.id %}"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow-sm hover:shadow transition duration-150 flex items-center text-sm"
                >
                    ✏️ Edit
                </a>
                <a
                    href="{% url 'delete_meal' meal.id %}"
                    class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-5 py-2.5 rounded-xl transition duration-150 text-sm border border-red-200/60"
                >
                    🗑️ Delete
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
